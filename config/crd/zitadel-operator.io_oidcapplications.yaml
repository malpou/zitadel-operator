---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: oidcapplications.zitadel-operator.io
spec:
  group: zitadel-operator.io
  names:
    kind: OIDCApplication
    listKind: OIDCApplicationList
    plural: oidcapplications
    singular: oidcapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .status.clientID
      name: Client ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OIDCApplication is an OIDC client in a Project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OIDCApplicationSpec mirrors the Terraform provider's zitadel_application_oidc.
            properties:
              accessTokenRoleAssertion:
                type: boolean
              accessTokenType:
                default: BEARER
                description: OIDCTokenType is the access token format.
                enum:
                - BEARER
                - JWT
                type: string
              appType:
                default: WEB
                description: OIDCAppType is the OIDC application type.
                enum:
                - WEB
                - USER_AGENT
                - NATIVE
                type: string
              authMethod:
                default: BASIC
                description: OIDCAuthMethod is how the client authenticates at the
                  token endpoint.
                enum:
                - BASIC
                - NONE
                type: string
              deletionPolicy:
                default: Delete
                description: DeletionPolicy says what happens in Zitadel when the
                  CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              grantTypes:
                default:
                - AUTHORIZATION_CODE
                - REFRESH_TOKEN
                items:
                  description: OIDCGrantType is an OIDC grant type.
                  enum:
                  - AUTHORIZATION_CODE
                  - REFRESH_TOKEN
                  type: string
                type: array
              idTokenRoleAssertion:
                type: boolean
              idTokenUserinfoAssertion:
                type: boolean
              name:
                minLength: 1
                type: string
              postLogoutRedirectURIs:
                items:
                  type: string
                type: array
              projectRef:
                description: ProjectRef names the Project CR (same namespace) the
                  app belongs to.
                minLength: 1
                type: string
              redirectURIs:
                items:
                  type: string
                type: array
              responseTypes:
                default:
                - CODE
                items:
                  description: OIDCResponseType is an OIDC response type.
                  enum:
                  - CODE
                  type: string
                type: array
              secretRef:
                description: SecretRef receives client-id (always) and client-secret
                  (BASIC only).
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace defaults to the CR's namespace.
                    type: string
                required:
                - name
                type: object
              skipNativeAppSuccessPage:
                type: boolean
            required:
            - name
            - projectRef
            type: object
          status:
            description: OIDCApplicationStatus adds the public client id and rotation
              bookkeeping.
            properties:
              clientID:
                type: string
              conditions:
                description: Conditions carries the single Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                description: ID is the Zitadel resource id once created or adopted.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              rotatedFor:
                description: RotatedFor is the rotate annotation value the current
                  secret was generated for.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
