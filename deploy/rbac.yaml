apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zitadel-operator
rules:
  - apiGroups: [zitadel-operator.io]
    resources:
      - actions
      - emailproviders
      - loginpolicies
      - machineusers
      - messagetexts
      - oidcapplications
      - projects
      - usergrants
    verbs: [get, list, watch, update, patch]
  - apiGroups: [zitadel-operator.io]
    resources:
      - actions/status
      - emailproviders/status
      - loginpolicies/status
      - machineusers/status
      - messagetexts/status
      - oidcapplications/status
      - projects/status
      - usergrants/status
    verbs: [get, update, patch]
  # Output Secrets land in the consuming apps' namespaces, hence cluster-wide.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zitadel-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zitadel-operator
subjects:
  - kind: ServiceAccount
    name: zitadel-operator
    namespace: zitadel-operator
