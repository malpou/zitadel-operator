name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod
      - name: Generated deepcopy and CRDs are current
        run: go generate ./... && git diff --exit-code
      - run: go build ./... && go vet ./... && go test ./...

  # Strict lint, see .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7

  # Builds and pushes, nothing else: MetsaApp/deploy runs the operator
  # (services/zitadel-operator), and Flux image automation there moves its
  # tag. `main-<commit time>-<sha12>` is what that automation follows: it picks
  # the newest commit time, so a re-run of an older build never moves the
  # cluster back. `sha-<sha12>` names one immutable image for a tag set by hand.
  image:
    if: github.event_name == 'push'
    needs: [check, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/malpou/zitadel-operator
          docker buildx build --push --platform linux/amd64 \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag "${image}:sha-${SHA:0:12}" \
            --tag "${image}:main-$(git show -s --format=%ct HEAD)-${SHA:0:12}" .
